<!DOCTYPE html>

<html>
<head>
    <title>Payments</title>
    <script src="api.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadPayments()">
    <h2>Payments</h2>
    <button onclick="logout()" style="right:10px;">Logout</button>

<nav>
    <a href="/products">Products</a>
    <a href="/orders">Orders</a>
    <a href="/payments">Payments</a>
    <a href="/inventories">Inventory</a>

</nav>
<br>

<h3>Add Payment</h3>
<select id="paymentMethod" style="height:36px;">
    <option value="CARD" selected>Card</option>
    <option value="PAYPAL">PayPal</option>
    <option value="CASH">Cash</option>
</select>
<input id="orderId" type="number" placeholder="Order ID">
<button onclick="addPayment()">Add</button>

<h3>Payment List</h3>
<table id="paymentTable">
    <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>Payment Method</th>
        <th>Order ID</th>
        <th>User ID</th>
        <th>Created At</th>
    </tr>
</table>

<script>
    function logout() {
        localStorage.removeItem("jwt");
        window.location.href = "/login";
    }

    function loadPayments() {
        requireAuth();
        api("/payment/api")
        .then(payments => {
            const table = document.getElementById("paymentTable");
            payments.forEach(p => {
                const row = table.insertRow();
                row.insertCell().textContent = p.id ?? "";
                row.insertCell().textContent = p.amount ?? "";
                row.insertCell().textContent = p.paymentMethod ?? "";
                row.insertCell().textContent = p.orderId ?? "";
                row.insertCell().textContent = p.userId ?? "";
                row.insertCell().textContent = p.createdAt ?? "";
            });
        });
    }

    function addPayment() {
        const paymentMethod = document.getElementById("paymentMethod").value;
        const orderId = parseInt(document.getElementById("orderId").value);
        
        api("/payment/api", "POST", {paymentMethod, orderId })
        .then(() => location.reload());
    }
</script>

</body>
</html>
