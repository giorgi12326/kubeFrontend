<!DOCTYPE html>
<html>
<head>
    <title>Inventories</title>
    <script src="api.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        table.nested { margin-top: 5px; }
        table.nested th, table.nested td { border: 1px solid #aaa; padding: 4px; font-size: 0.9em; }
    </style>
</head>
<body onload="loadInventories()">

<h2>Inventory Management</h2>
<button onclick="logout()" style="float:right;">Logout</button>

<nav>
    <a href="/inventory">Inventory</a>
    <a href="/products">Products</a>
    <a href="/orders">Orders</a>
</nav>
<br>

<h3>Add Product</h3>
<select id="inventorySelect"></select>
<input type="number" id="productId" placeholder="Product ID">
<input type="number" id="quantity" placeholder="Quantity">
<button onclick="addProduct()">Add Product</button>

<h3>Inventory List</h3>
<table id="inventoryTable">
    <tr>
        <th>ID</th>
        <th>Location</th>
        <th>Created At</th>
        <th>Updated At</th>
        <th>Products</th>
    </tr>
</table>

<script>
function logout() {
    localStorage.removeItem("jwt");
    window.location.href = "/login";
}

function loadInventories() {
    requireAuth();

    api("/inventory/api") // returns List<InventoryResponseDTO>
        .then(inventories => {
            const table = document.getElementById("inventoryTable");
            const select = document.getElementById("inventorySelect");
            table.innerHTML = `
                <tr>
                    <th>ID</th>
                    <th>Location</th>
                    <th>Created At</th>
                    <th>Updated At</th>
                    <th>Products</th>
                </tr>
            `;
            select.innerHTML = '';

            inventories.forEach(inv => {
                // Inventory row
                const row = table.insertRow();
                row.insertCell().textContent = inv.id ?? "";
                row.insertCell().textContent = inv.location ?? "";
                row.insertCell().textContent = inv.createdAt ?? "";
                row.insertCell().textContent = inv.updatedAt ?? "";

                // Nested table for products
                const productsCell = row.insertCell();
                if (inv.products && inv.products.length > 0) {
                    const nestedTable = document.createElement("table");
                    nestedTable.className = "nested";
                    nestedTable.innerHTML = "<tr><th>Product ID</th><th>Quantity</th></tr>";

                    inv.products.forEach(p => {
                        const innerRow = nestedTable.insertRow();
                        innerRow.insertCell().textContent = p.productId;
                        innerRow.insertCell().textContent = p.quantity;
                    });

                    productsCell.appendChild(nestedTable);
                } else {
                    productsCell.textContent = "No products";
                }

                // Fill inventory dropdown
                const option = document.createElement("option");
                option.value = inv.id;
                option.textContent = `Inventory ${inv.id} (${inv.location})`;
                select.appendChild(option);
            });
        });
}

function addProduct() {
    const inventoryId = parseInt(document.getElementById("inventorySelect").value);
    const productId = parseInt(document.getElementById("productId").value);
    const quantity = parseInt(document.getElementById("quantity").value);

    if (!inventoryId || !productId || !quantity) {
        alert("Please fill all fields correctly.");
        return;
    }

    console.log({ inventoryId, productId, quantity }); // debug

    api("/inventory/product", "POST", { inventoryId, productId, quantity })
        .then(() => {
            document.getElementById("productId").value = '';
            document.getElementById("quantity").value = '';
            loadInventories();
        });
}
</script>

</body>
</html>
