<!DOCTYPE html>
<html>
<head>
    <title>Inventories</title>
    <script src="api.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-list { display: none; margin-top: 5px; }
        .product-list.visible { display: block; }
        .inventory-row { cursor: pointer; }
        .add-product-btn { margin-left: 10px; }
    </style>
</head>
<body onload="loadInventories()">

<h2>Inventories</h2>
<button onclick="logout()" style="float:right;">Logout</button>

<nav>
    <a href="/products">Products</a>
    <a href="/orders">Orders</a>
    <a href="/payments">Payments</a>
    <a href="/inventories">Inventory</a>
</nav>
<br>

<h3>Inventory List</h3>
<table id="inventoryTable">
    <tr>
        <th>ID</th>
        <th>Location</th>
        <th>Created At</th>
        <th>Updated At</th>
        <th>Products</th>
        <th>Actions</th>
    </tr>
</table>

<script>
function logout() {
    localStorage.removeItem("jwt");
    window.location.href = "/login";
}

function loadInventories() {
    requireAuth();
    api("/inventory/api/inventory")
        .then(inventories => {
            const table = document.getElementById("inventoryTable");
            inventories.forEach(inv => {
                const row = table.insertRow();
                row.classList.add("inventory-row");

                row.insertCell().textContent = inv.id ?? "";
                row.insertCell().textContent = inv.location ?? "";
                row.insertCell().textContent = inv.createdAt ?? "";
                row.insertCell().textContent = inv.updatedAt ?? "";

                // Products expandable list
                const productCell = row.insertCell();
                const productList = document.createElement("ul");
                productList.className = "product-list";
                if (inv.products && inv.products.length > 0) {
                    inv.products.forEach(p => {
                        const li = document.createElement("li");
                        li.textContent = `Product ID: ${p.productId}, Quantity: ${p.quantity}`;
                        productList.appendChild(li);
                    });
                } else {
                    const li = document.createElement("li");
                    li.textContent = "No products";
                    productList.appendChild(li);
                }
                productCell.appendChild(productList);

                // Toggle product list on click
                row.addEventListener("click", () => {
                    productList.classList.toggle("visible");
                });

                // Actions cell
                const actionCell = row.insertCell();
                const addBtn = document.createElement("button");
                addBtn.textContent = "Add Product";
                addBtn.className = "add-product-btn";
                addBtn.onclick = (e) => {
                    e.stopPropagation(); // prevent row toggle
                    const productId = prompt("Enter Product ID:");
                    const quantity = prompt("Enter Quantity:");
                    if (productId && quantity) {
                        addProductToInventory(inv.id, productId, quantity);
                    }
                };
                actionCell.appendChild(addBtn);
            });
        });
}

function addProductToInventory(inventoryId, productId, quantity) {
    api(`/inventory/api/product`, "POST", {inventoryId, productId, quantity })
        .then(() => {
            alert("Product added successfully!");
            location.reload();
        })
        .catch(err => alert("Error adding product: " + err));
}
</script>

</body>
</html>
