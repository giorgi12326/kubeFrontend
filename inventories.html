<!DOCTYPE html>
<html>
<head>
    <title>Inventories</title>
    <script src="api.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 8px 12px; text-align: left; }
        .inventory-table th, .inventory-table td { border-bottom: 1px solid #ccc; }
        .product-list { display: none; margin: 5px 0 10px 20px; width: auto; border: none; }
        .product-list th, .product-list td { border: 1px solid #ddd; padding: 6px 10px; }
        .add-product-form { margin: 5px 0 15px 20px; }
        .add-product-form input { margin-right: 5px; width: 100px; }
        .toggle-btn { margin: 5px 0; }
    </style>
</head>
<body onload="loadInventories()">

<h2>Inventories</h2>
<button onclick="logout()" style="float:right;">Logout</button>

<nav>
    <a href="/products">Products</a>
    <a href="/orders">Orders</a>
    <a href="/payments">Payments</a>
    <a href="/inventories">Inventory</a>
</nav>
<br>

<h3>Inventory List</h3>
<table class="inventory-table" id="inventoryTable">
    <tr>
        <th>ID</th>
        <th>Location</th>
        <th>Created At</th>
        <th>Updated At</th>
        <th>Actions</th>
    </tr>
</table>

<script>
function logout() {
    localStorage.removeItem("jwt");
    window.location.href = "/login";
}

function loadInventories() {
    requireAuth();
    api("/inventory/api/inventory")
        .then(inventories => {
            const table = document.getElementById("inventoryTable");
            table.innerHTML = `
                <tr>
                    <th>ID</th>
                    <th>Location</th>
                    <th>Created At</th>
                    <th>Updated At</th>
                    <th>Actions</th>
                </tr>
            `; // reset table

            inventories.forEach(inv => {
                const row = table.insertRow();
                row.insertCell().textContent = inv.id ?? "";
                row.insertCell().textContent = inv.location ?? "";
                row.insertCell().textContent = inv.createdAt ?? "";
                row.insertCell().textContent = inv.updatedAt ?? "";

                const actionCell = row.insertCell();

                // Toggle products button
                const toggleBtn = document.createElement("button");
                toggleBtn.textContent = "Show Products";
                toggleBtn.className = "toggle-btn";
                actionCell.appendChild(toggleBtn);

                // Products table
                const productTable = document.createElement("table");
                productTable.className = "product-list";
                const headerRow = productTable.insertRow();
                ["ID", "Product ID", "Quantity"].forEach(col => {
                    const th = document.createElement("th");
                    th.textContent = col;
                    headerRow.appendChild(th);
                });

                if (inv.products && inv.products.length > 0) {
                    inv.products.forEach(p => {
                        const prow = productTable.insertRow();
                        prow.insertCell().textContent = p.id ?? "";
                        prow.insertCell().textContent = p.productId ?? "";
                        prow.insertCell().textContent = p.quantity ?? "";
                    });
                } else {
                    const prow = productTable.insertRow();
                    const cell = prow.insertCell();
                    cell.colSpan = 3;
                    cell.textContent = "No products";
                }

                // Add Product form
                const formDiv = document.createElement("div");
                formDiv.className = "add-product-form";
                const inputProductId = document.createElement("input");
                inputProductId.placeholder = "Product ID";
                inputProductId.type = "number";
                const inputQuantity = document.createElement("input");
                inputQuantity.placeholder = "Quantity";
                inputQuantity.type = "number";
                const addBtn = document.createElement("button");
                addBtn.textContent = "Add Product";
                addBtn.onclick = () => {
                    const productId = inputProductId.value;
                    const quantity = inputQuantity.value;
                    if (!productId || !quantity) return;
                    addProductToInventory(inv.id, productId, quantity);
                };

                formDiv.appendChild(inputProductId);
                formDiv.appendChild(inputQuantity);
                formDiv.appendChild(addBtn);

                // Insert products table and form after row
                const productsRow = table.insertRow();
                const productsCell = productsRow.insertCell();
                productsCell.colSpan = 5;
                productsCell.appendChild(productTable);
                productsCell.appendChild(formDiv);

                toggleBtn.onclick = () => {
                    productTable.classList.toggle("visible");
                    formDiv.style.display = productTable.classList.contains("visible") ? "block" : "none";
                    toggleBtn.textContent = productTable.classList.contains("visible") ? "Hide Products" : "Show Products";
                };
            });
        });
}

function addProductToInventory(inventoryId, productId, quantity) {
    api(`/inventory/api/product`, "POST", { inventoryId, productId, quantity })
        .then(() => loadInventories())
        .catch(err => console.error("Error adding product:", err));
}
</script>

</body>
</html>
