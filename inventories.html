<!DOCTYPE html>
<html>
<head>
    <title>Inventories</title>
    <script src="api.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-list { display: none; margin-top: 5px; margin-left: 20px; }
        .product-list.visible { display: block; }
        .inventory-row { border-bottom: 1px solid #ccc; padding: 5px; }
        .inventory-header { font-weight: bold; }
        .add-product-btn { margin-top: 5px; }
    </style>
</head>
<body onload="loadInventories()">

<h2>Inventories</h2>
<button onclick="logout()" style="float:right;">Logout</button>

<nav>
    <a href="/products">Products</a>
    <a href="/orders">Orders</a>
    <a href="/payments">Payments</a>
    <a href="/inventories">Inventory</a>
</nav>
<br>

<h3>Inventory List</h3>
<div id="inventoryContainer"></div>

<script>
function logout() {
    localStorage.removeItem("jwt");
    window.location.href = "/login";
}

function loadInventories() {
    requireAuth();
    api("/inventory/api/inventory")
        .then(inventories => {
            const container = document.getElementById("inventoryContainer");
            inventories.forEach(inv => {
                const invDiv = document.createElement("div");
                invDiv.className = "inventory-row";

                // Inventory header
                const header = document.createElement("div");
                header.className = "inventory-header";
                header.textContent = `ID: ${inv.id} | Location: ${inv.location} | Created: ${inv.createdAt} | Updated: ${inv.updatedAt}`;
                invDiv.appendChild(header);

                // Toggle products button
                const toggleBtn = document.createElement("button");
                toggleBtn.textContent = "Show Products";
                toggleBtn.style.marginTop = "5px";
                invDiv.appendChild(toggleBtn);

                // Products list
                const productList = document.createElement("ul");
                productList.className = "product-list";
                if (inv.products && inv.products.length > 0) {
                    inv.products.forEach(p => {
                        const li = document.createElement("li");
                        li.textContent = `Product ID: ${p.productId}, Quantity: ${p.quantity}`;
                        productList.appendChild(li);
                    });
                } else {
                    const li = document.createElement("li");
                    li.textContent = "No products";
                    productList.appendChild(li);
                }
                invDiv.appendChild(productList);

                toggleBtn.onclick = () => {
                    productList.classList.toggle("visible");
                    toggleBtn.textContent = productList.classList.contains("visible") ? "Hide Products" : "Show Products";
                };

                // Add Product button (after product list)
                const addBtn = document.createElement("button");
                addBtn.textContent = "Add Product";
                addBtn.className = "add-product-btn";
                addBtn.onclick = () => {
                    const productId = prompt("Enter Product ID:");
                    const quantity = prompt("Enter Quantity:");
                    if (productId && quantity) {
                        addProductToInventory(inv.id, productId, quantity);
                    }
                };
                invDiv.appendChild(addBtn);

                container.appendChild(invDiv);
            });
        });
}

function addProductToInventory(inventoryId, productId, quantity) {
    api(`/inventory/api/product`, "POST", {inventoryId, productId, quantity })
        .then(() => {
            alert("Product added successfully!");
            location.reload();
        })
        .catch(err => alert("Error adding product: " + err));
}
</script>

</body>
</html>
